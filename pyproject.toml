[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siren-trap"
version = "0.1.0"
description = "Active semantic lure and multimodal AI security research framework"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "ALY HUSSEIN FEKRY ZOPAIR" },
]
keywords = [
  "ai-security",
  "multimodal-security",
  "ai-red-teaming",
  "defensive-security",
  "acoustic-canary",
  "audio-analysis",
  "honeypot",
  "security-telemetry",
  "threat-modeling",
  "flask",
  "ggwave",
  "semantic-lure",
  "agent-containment",
  "counterfactual-evaluation",
  "python",
  "security-research",
  "trust-boundaries",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: Flask",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "ggwave>=0.4.2,<0.5.0",
  "Flask>=3.1,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1"]

[project.scripts]
siren-mcp = "siren_trap.siren_lure.mcp_server:main"

[project.urls]
Homepage = "https://zopair.github.io/Siren/"
Repository = "https://github.com/zopair/Siren"
Documentation = "https://zopair.github.io/Siren/"
Issues = "https://github.com/zopair/Siren/issues"
Security = "https://github.com/zopair/Siren/security"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
