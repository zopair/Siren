<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Siren-Trap defensive research architecture</title>
  <desc id="desc">A four-stage local research workflow connecting an authorized test scope, a fixed inert canary, a controlled receiver, and offline telemetry analysis.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10243a"/><stop offset="1" stop-color="#091321"/></linearGradient>
    <linearGradient id="node" x2="0" y2="1"><stop stop-color="#1b3b58"/><stop offset="1" stop-color="#12263d"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#31506b" stroke-opacity=".35"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0V6L7 3Z" fill="#77d2fa"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/><rect width="1200" height="620" rx="28" fill="url(#grid)"/>
  <rect x="34" y="34" width="1132" height="552" rx="24" fill="none" stroke="#75d6ad" stroke-opacity=".65" stroke-dasharray="6 10"/>
  <text x="72" y="84" fill="#8ce0ba" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="4">AUTHORIZED / ISOLATED RESEARCH BOUNDARY</text>
  <g fill="none" stroke="#77d2fa" stroke-width="4" stroke-dasharray="10 12" marker-end="url(#arrow)" opacity=".9">
    <path d="M285 300H345"/><path d="M555 300H615"/><path d="M825 300H885"/>
  </g>
  <g font-family="Arial,sans-serif">
    <g transform="translate(75 205)"><rect width="210" height="190" rx="18" fill="url(#node)" stroke="#4c82a8" stroke-width="2"/><text x="26" y="48" fill="#8cddff" font-size="22" font-weight="700">01</text><text x="26" y="92" fill="#f0f7ff" font-size="25" font-weight="700">Test scope</text><text x="26" y="126" fill="#b4c8da" font-size="16">Authorized setup</text><text x="26" y="153" fill="#b4c8da" font-size="16">Local-first boundary</text></g>
    <g transform="translate(345 205)"><rect width="210" height="190" rx="18" fill="url(#node)" stroke="#4c82a8" stroke-width="2"/><text x="26" y="48" fill="#8cddff" font-size="22" font-weight="700">02</text><text x="26" y="92" fill="#f0f7ff" font-size="25" font-weight="700">Fixed canary</text><text x="26" y="126" fill="#b4c8da" font-size="16">Harmless marker</text><text x="26" y="153" fill="#b4c8da" font-size="16">No executable content</text></g>
    <g transform="translate(615 205)"><rect width="210" height="190" rx="18" fill="url(#node)" stroke="#4c82a8" stroke-width="2"/><text x="26" y="48" fill="#8cddff" font-size="22" font-weight="700">03</text><text x="26" y="92" fill="#f0f7ff" font-size="25" font-weight="700">Receiver</text><text x="26" y="126" fill="#b4c8da" font-size="16">Controlled capture</text><text x="26" y="153" fill="#b4c8da" font-size="16">Observation only</text></g>
    <g transform="translate(885 205)"><rect width="240" height="190" rx="18" fill="url(#node)" stroke="#4c82a8" stroke-width="2"/><text x="26" y="48" fill="#8cddff" font-size="22" font-weight="700">04</text><text x="26" y="92" fill="#f0f7ff" font-size="25" font-weight="700">Telemetry</text><text x="26" y="126" fill="#b4c8da" font-size="16">Structured local events</text><text x="26" y="153" fill="#b4c8da" font-size="16">Offline evidence review</text></g>
  </g>
  <circle cx="315" cy="300" r="5" fill="#8cddff" filter="url(#glow)"/><circle cx="585" cy="300" r="5" fill="#8cddff" filter="url(#glow)"/><circle cx="855" cy="300" r="5" fill="#8cddff" filter="url(#glow)"/>
  <text x="600" y="475" text-anchor="middle" fill="#e8f3ff" font-family="Arial,sans-serif" font-size="22" font-weight="700">OBSERVE  →  RECORD  →  EVALUATE</text>
  <text x="600" y="518" text-anchor="middle" fill="#9cb2c8" font-family="Arial,sans-serif" font-size="16">No agent control  ·  No instruction execution  ·  No external telemetry</text>
  <text x="600" y="558" text-anchor="middle" fill="#66849f" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">SIREN-TRAP / DEFENSIVE MULTIMODAL SECURITY RESEARCH</text>
</svg>